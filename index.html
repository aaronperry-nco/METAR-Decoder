<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto METAR Decoder</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; padding: 20px; }
        .container { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        textarea { width: 100%; height: 80px; padding: 10px; margin-bottom: 20px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-family: monospace; font-size: 16px; }
        .result-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #eee; }
        .result-row strong { color: #333; }
        .result-row span { color: #0056b3; }
        #output { margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Paste METAR Here</h2>
    <textarea id="metarInput" placeholder="e.g. KJFK 121453Z 31015G25KT 10SM SCT040 15/08 A2992" oninput="decodeMetar()"></textarea>

    <h3>Decoded Output</h3>
    <div id="output">
        <p style="color: #888;">Awaiting input...</p>
    </div>
</div>

<script>
    async function decodeMetar() {
        const input = document.getElementById('metarInput').value.trim();
        const outputDiv = document.getElementById('output');

        if (input.length === 0) {
            outputDiv.innerHTML = '<p style="color: #888;">Awaiting input...</p>';
            return;
        }

        try {
            // Send the raw string to our PHP script using the Fetch API
            const response = await fetch('decode.php', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: 'metar=' + encodeURIComponent(input)
            });

            const data = await response.json();
            
            if (data.error) {
                outputDiv.innerHTML = `<p style="color: red;">${data.error}</p>`;
                return;
            }

            // Build the HTML to display the decoded parameters
            let htmlContent = '';
            for (const [key, value] of Object.entries(data.decoded)) {
                htmlContent += `
                    <div class="result-row">
                        <strong>${key}</strong>
                        <span>${value}</span>
                    </div>
                `;
            }

            if (htmlContent === '') {
                htmlContent = '<p style="color: orange;">Could not parse METAR data.</p>';
            }

            outputDiv.innerHTML = htmlContent;

        } catch (error) {
            console.error('Error decoding METAR:', error);
            outputDiv.innerHTML = '<p style="color: red;">An error occurred while decoding.</p>';
        }
    }
</script>

</body>
</html>
